[project]
name = "git-cities"
version = "0.1.0"
description = "Git history time-lapse renderer: turn a repository's history into an animated 3D city."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "playwright>=1.45",
]

[project.scripts]
git-cities = "git_cities.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_cities"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
